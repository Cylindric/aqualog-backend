version: '3'

vars:
  ContainerName: aqualog-backend
  Version:
    sh: poetry run cz version --project || echo "0.0.0"
  MajorVersion:
    sh: poetry run cz version --project --major || echo "0"

dotenv:
  - ../.env

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  init:
    desc: Set up the project environment
    cmds:
      - cmd: ./tools/setup.sh

  build:
    desc: Build the project
    cmds:
      - task: backend:build
      - task: mail:build

  backend:build:
    desc: Build the project
    cmds:
      - cmd: docker build -t {{.ContainerName}}:latest .
      - cmd: docker image tag {{.ContainerName}}:latest {{.ContainerName}}:{{.Version}}

  mail:build:
    desc: Build the mail proxy Docker image
    cmds:
      - cmd: cd mail_proxy && docker build -t aqualog-mail-proxy:latest .

  publish:
    desc: Publish the docker image to the registry
    cmds:
      - cmd: docker push {{.ContainerName}}:{{.Version}}
      - cmd: docker push {{.ContainerName}}:latest

  scan:
    desc: Run Trivy scan for vulnerabilities
    cmds:
      - task: backend:scan
      - task: mail:scan

  backend:scan:
    desc: Run Trivy scan for vulnerabilities
    cmds:
      - cmd: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v /var/cache/trivy:/tmp \
          -v ./.build/trivy:/data \
          aquasec/trivy image \
          --no-progress \
          --format json --output /data/backend-{{.Version}}.json \
          --scanners vuln,secret \
          --image-config-scanners misconfig,secret \
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
          --cache-dir /tmp/trivy \
          {{.ContainerName}}:{{.Version}}
      - cmd: |
          docker run --rm \
          -v ./.build/trivy:/data \
          aquasec/trivy convert \
          --severity MEDIUM,HIGH,CRITICAL \
          --format table --output /data/backend-{{.Version}}.txt \
          /data/backend-{{.Version}}.json
      - task: mail:scan

  mail:scan:
    desc: Run Trivy scan for vulnerabilities
    cmds:
      - cmd: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v /var/cache/trivy:/tmp \
          -v ./.build/trivy:/data \
          aquasec/trivy image \
          --no-progress \
          --format json --output /data/mail-proxy-{{.Version}}.json \
          --scanners vuln,secret \
          --image-config-scanners misconfig,secret \
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
          --cache-dir /tmp/trivy \
          aqualog-mail-proxy:latest
      - cmd: |
          docker run --rm \
          -v ./.build/trivy:/data \
          aquasec/trivy convert \
          --severity MEDIUM,HIGH,CRITICAL \
          --format table --output /data/mail-proxy-{{.Version}}.txt \
          /data/mail-proxy-{{.Version}}.json

  up:
    desc: Build and start the API service with docker-compose
    interactive: true
    silent: true
    cmds:
      - cmd: docker compose up

  down:
    desc: Stop docker-compose services for this project
    cmds:
      - cmd: docker compose down

  server:
    desc: Start the API server locally
    env:
      AQUALOG_DB_HOST: localhost
    cmds:
      - cmd: poetry lock
      - cmd: poetry sync
      - cmd: poetry run alembic upgrade head
      - cmd: |
          export AQUALOG_APP_VERSION=$(poetry run cz version -p)
          poetry run uvicorn src.app:create_app --reload --factory --host 0.0.0.0 --port 8001

  lint:
    desc: Lint the codebase with ruff
    cmds:
      - cmd: poetry run ruff check --fix .

  format:
    desc: Format the codebase with ruff
    cmds:
      - cmd: poetry run ruff format .

  typecheck:
    desc: Run mypy static type checking
    cmds:
      - cmd: poetry run mypy src

  precommit-run:
    desc: Run all pre-commit hooks against the full repo
    cmds:
      - cmd: poetry run pre-commit run --all-files

  db-migrate:
    desc: Run pending database migrations
    cmds:
      - cmd: poetry run alembic upgrade head

  db-migration-new:
    desc: Create a new migration (name via NAME var)
    cmds:
      - cmd: poetry run alembic revision --autogenerate -m "{{.NAME}}"

  auth-check:
    desc: Validate Authentik token issuance and API authentication without inline secrets
    dir: ./tools/spa
    cmds:
      - cmd: ./provider-aqualog-spa-dev.sh

  test:
    desc: Run the test suite with coverage summary and HTML test report
    env:
      AQUALOG_APP_ENV: test
    cmds:
      - mkdir -p artifacts/tests
      - poetry run pytest -q --cov=src --cov-report=term-missing --html=artifacts/tests/index.html

  coverage:
    desc: Run tests with coverage outputs and HTML test report
    env:
      AQUALOG_APP_ENV: test
    cmds:
      - mkdir -p artifacts/coverage
      - poetry run pytest -q --cov=src --cov-report=term-missing --cov-report=html:artifacts/coverage --cov-report=xml --html=artifacts/tests/index.html

  clean:
    desc: Clean up build artifacts and temporary files
    cmds:
      - cmd: docker compose down --volumes --remove-orphans
      - cmd: rm -rf .data
      - cmd: rm -rf artifacts

  clean-all:
    desc: Clean up all build artifacts, temporary files, and Docker images
    cmds:
      - task: clean
      - cmd: docker rmi {{.ContainerName}}:{{.Version}} --force
      - cmd: rm -rf .env
      - cmd: rm -rf .venv

  run:
    desc: Open a bash shell in the backend container
    cmds:
      - cmd: docker run --rm -it {{.ContainerName}}:{{.Version}}

  bash:
    desc: Open a bash shell in the backend container
    cmds:
      - cmd: docker run --rm -it {{.ContainerName}}:latest bash

  mail:bash:
    desc: Open a bash shell in the mail proxy container
    cmds:
      - cmd: docker run --rm -it aqualog-mail-proxy:latest ash

  token:
    desc: Generate a new Authentik token for API authentication
    silent: true
    cmds:
      - cmd: ./tools/get_token-dev.sh
